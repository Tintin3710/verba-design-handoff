<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verba — 브랜드 보이스(작성 완료) · Onboarding</title>
<style>
  :root{
    --brand:#5F3EFF; --brand-pale:#F1EFFD; --brand-chip:#E2DDFB; --brand-border:#CFC2FF;
    --ink:#28283C; --body:#4E5968; --mute:#6E6E7A; --faint:#9A9AA6;
    --surface:#FFFFFF; --page:#F7F7FA; --soft:#F8F8FA;
    --border:#E6E6EB; --border-subtle:#EDEDF1;
    --danger:#DC2626; --danger-pale:#FBECEC;
    --r-card:16px; --r-input:12px; --r-btn:10px;
    --font:"Pretendard","Pretendard Variable",-apple-system,"Inter",system-ui,"Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font); color:var(--ink); background:var(--page); -webkit-font-smoothing:antialiased; line-height:1.5}
  button{font-family:inherit; cursor:pointer}

  /* top nav */
  .nav{height:60px; background:var(--surface); border-bottom:1px solid var(--border);
       display:flex; align-items:center; justify-content:space-between; padding:0 40px}
  .nav .left{display:flex; align-items:center; gap:40px}
  .wordmark{font-size:22px; font-weight:800; letter-spacing:-.02em}
  .nav-menu{display:flex; gap:6px}
  .nav-menu a{padding:8px 12px; font-size:14px; font-weight:500; color:var(--body); border-radius:8px; text-decoration:none}
  .nav-menu a:hover{background:var(--soft); color:var(--ink)}
  .nav .right{display:flex; align-items:center; gap:8px}
  .btn-ghost{background:none; border:0; padding:10px 14px; font-size:14px; font-weight:600; color:var(--body); border-radius:var(--r-btn)}
  .btn-ghost:hover{background:var(--soft)}
  .btn-brand{background:var(--brand); border:0; color:#fff; padding:12px 18px; font-size:14px; font-weight:600; border-radius:var(--r-btn)}
  .btn-brand:hover{background:#4F2BEA}

  /* stepper */
  .wrap{max-width:1440px; margin:0 auto; padding:38px 24px 80px}
  .stepper{display:flex; align-items:center; justify-content:center; gap:0; margin-bottom:32px}
  .step{display:flex; align-items:center; gap:9px}
  .dot{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:700; flex:none}
  .dot.done{background:var(--brand); color:#fff}
  .dot.active{background:var(--brand); color:#fff}
  .dot.todo{background:#fff; border:1px solid var(--border); color:var(--faint)}
  .step .lbl{font-size:13px; font-weight:600}
  .step.done .lbl{color:var(--body)}
  .step.active .lbl{color:var(--brand)}
  .step.todo .lbl{color:var(--faint)}
  .divider{width:26px; height:1px; background:var(--border); margin:0 12px}

  /* card */
  .card{width:520px; margin:0 auto; background:var(--surface); border:1px solid var(--border);
        border-radius:var(--r-card); padding:29px 29px 26px; box-shadow:0 18px 44px -30px rgba(30,27,75,.10)}
  .h2{font-size:22px; font-weight:700; letter-spacing:-.02em}
  .lede{margin-top:9px; font-size:13.5px; color:var(--mute)}
  .lede b{color:var(--body); font-weight:700}

  .field{margin-top:22px}
  .field:first-of-type{margin-top:24px}
  .field > .lab{display:flex; align-items:baseline; gap:8px; margin-bottom:9px}
  .field > .lab .t{font-size:14px; font-weight:700; color:var(--ink)}
  .field > .lab .hint{font-size:12px; color:var(--faint); font-weight:500}
  .field > .lab .opt{font-size:12px; color:var(--faint); font-weight:600}

  .input{width:100%; height:47px; border:1px solid var(--border); border-radius:var(--r-input);
         padding:0 15px; font-size:15px; color:var(--ink); background:#fff; outline:none}
  .input::placeholder{color:var(--faint)}
  .input:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-pale)}
  .input.filled{font-weight:500}

  /* tone chips */
  .chips{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px}
  .chip{height:39px; padding:0 17px; border-radius:9999px; border:1px solid var(--border);
        background:#fff; font-size:13.5px; font-weight:600; color:var(--body); display:inline-flex; align-items:center; transition:.12s}
  .chip:hover{border-color:var(--brand-border)}
  .chip.on{background:var(--brand-chip); border-color:var(--brand); color:var(--brand)}

  /* 금칙어 token input */
  .tokbox{min-height:47px; border:1px solid var(--border); border-radius:var(--r-input);
          background:#fff; padding:7px 9px; display:flex; flex-wrap:wrap; gap:7px; align-items:center; cursor:text}
  .tokbox:focus-within{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-pale)}
  .tok{display:inline-flex; align-items:center; gap:6px; height:31px; padding:0 6px 0 11px;
       background:var(--danger-pale); border:1px solid #F2CFCF; color:#B4271F; border-radius:8px; font-size:13px; font-weight:600; white-space:nowrap}
  .tok .x{width:17px; height:17px; border-radius:5px; display:grid; place-items:center; color:#C15750; border:0; background:transparent; font-size:14px; line-height:1}
  .tok .x:hover{background:#F4D4D2; color:#8f1d17}
  .tokinput{border:0; outline:none; font-size:14px; font-family:inherit; color:var(--ink); flex:1; min-width:120px; height:31px; background:transparent}
  .tokinput::placeholder{color:var(--faint)}
  .tokhelp{margin-top:8px; font-size:12px; color:var(--mute)}
  .tokhelp b{color:var(--body); font-weight:700}

  /* info banner */
  .banner{margin-top:22px; display:flex; gap:11px; padding:15px 16px; background:var(--brand-pale);
          border:1px solid #E6E0FF; border-radius:12px}
  .banner .star{color:var(--brand); font-size:15px; line-height:1.4; flex:none}
  .banner p{font-size:12.5px; line-height:1.55; color:var(--body)}
  .banner b{color:var(--brand); font-weight:700}

  /* footer */
  .foot{margin-top:24px; display:flex; align-items:center; justify-content:space-between}
  .btn-later{background:none; border:0; font-size:14px; font-weight:600; color:var(--body); padding:10px 4px}
  .btn-later:hover{color:var(--ink)}
  .btn-next{background:var(--brand); border:0; color:#fff; font-size:15px; font-weight:600; padding:14px 22px; border-radius:var(--r-btn)}
  .btn-next:hover{background:#4F2BEA}
</style>
</head>
<body>
  <!-- top nav -->
  <div class="nav">
    <div class="left">
      <span class="wordmark">Verba</span>
      <nav class="nav-menu">
        <a href="#">기능</a><a href="#">요금</a><a href="#">사례</a><a href="#">문의</a>
      </nav>
    </div>
    <div class="right">
      <button class="btn-ghost">로그인</button>
      <button class="btn-brand">무료로 시작하기</button>
    </div>
  </div>

  <div class="wrap">
    <!-- stepper -->
    <div class="stepper">
      <div class="step done"><span class="dot done">✓</span><span class="lbl">환영</span></div>
      <span class="divider"></span>
      <div class="step active"><span class="dot active">2</span><span class="lbl">브랜드 보이스</span></div>
      <span class="divider"></span>
      <div class="step todo"><span class="dot todo">3</span><span class="lbl">완료</span></div>
    </div>

    <!-- card -->
    <div class="card">
      <div class="h2">브랜드 보이스를 알려주세요</div>
      <p class="lede">여기서 만든 톤이 생성되는 모든 카피에 <b>기본으로 적용</b>돼요.</p>

      <!-- 브랜드·스토어명 -->
      <div class="field">
        <div class="lab"><span class="t">브랜드 · 스토어명</span></div>
        <input class="input filled" type="text" value="초록상회">
      </div>

      <!-- 주요 업종 -->
      <div class="field">
        <div class="lab"><span class="t">주요 업종</span></div>
        <input class="input filled" type="text" value="요식업 · 밀키트 / 신선식품">
      </div>

      <!-- 기본 톤 -->
      <div class="field">
        <div class="lab"><span class="t">기본 톤</span><span class="hint">직접 입력하거나 골라주세요</span></div>
        <input class="input filled" type="text" value="다정하지만 전문적으로, 살짝 위트 있게 — 재료 이야기부터">
        <div class="chips" id="chips">
          <button class="chip on">친근함</button>
          <button class="chip on">신뢰감</button>
          <button class="chip">고급스러움</button>
          <button class="chip">발랄함</button>
          <button class="chip">전문적</button>
          <button class="chip">감성적</button>
          <button class="chip">유머러스</button>
          <button class="chip">미니멀</button>
          <button class="chip">트렌디</button>
          <button class="chip on">따뜻함</button>
          <button class="chip">단호함</button>
          <button class="chip">위트있게</button>
        </div>
      </div>

      <!-- 피하고 싶은 표현 (금칙어) -->
      <div class="field">
        <div class="lab"><span class="t">피하고 싶은 표현</span><span class="opt">선택</span></div>
        <div class="tokbox" id="tokbox">
          <span class="tok">최고<button class="x" aria-label="삭제">×</button></span>
          <span class="tok">1위<button class="x" aria-label="삭제">×</button></span>
          <span class="tok">국내 최초<button class="x" aria-label="삭제">×</button></span>
          <span class="tok">완치<button class="x" aria-label="삭제">×</button></span>
          <span class="tok">부작용 없음<button class="x" aria-label="삭제">×</button></span>
          <span class="tok">100% 안전<button class="x" aria-label="삭제">×</button></span>
          <span class="tok">무조건<button class="x" aria-label="삭제">×</button></span>
          <span class="tok">초저가<button class="x" aria-label="삭제">×</button></span>
          <input class="tokinput" id="tokinput" type="text" placeholder="표현 입력 후 Enter">
        </div>
        <p class="tokhelp">과장 최상급 · 의학적 효능 오인 · 단정 표현은 카피에서 <b>자동으로 제외</b>돼요.</p>
      </div>

      <!-- info banner -->
      <div class="banner">
        <span class="star">✦</span>
        <p>이 설정이 곧 <b>'우리 브랜드 · 기본'</b> 보이스예요. 생성 시 자동 적용되고, 언제든 사이드바 <b>[브랜드 보이스]</b> 메뉴에서 수정·추가할 수 있어요.</p>
      </div>

      <!-- footer -->
      <div class="foot">
        <button class="btn-later">나중에 하기</button>
        <button class="btn-next">다음 →</button>
      </div>
    </div>
  </div>

<script>
  // tone chip toggle
  document.getElementById('chips').addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if(c) c.classList.toggle('on');
  });

  // 금칙어 token input
  var box = document.getElementById('tokbox');
  var input = document.getElementById('tokinput');
  box.addEventListener('click', function(e){ if(e.target === box) input.focus(); });
  box.addEventListener('click', function(e){
    var x = e.target.closest('.x'); if(x){ x.closest('.tok').remove(); }
  });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      var v = input.value.trim(); if(!v) return;
      var tok = document.createElement('span'); tok.className='tok';
      tok.innerHTML = v.replace(/</g,'&lt;') + '<button class="x" aria-label="삭제">×</button>';
      box.insertBefore(tok, input); input.value='';
    } else if(e.key === 'Backspace' && input.value === ''){
      var toks = box.querySelectorAll('.tok'); if(toks.length) toks[toks.length-1].remove();
    }
  });
</script>
</body>
</html>
