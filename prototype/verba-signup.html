<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Verba — 회원가입</title>
<style>
  :root{
    --brand:#5F3EFF; --brand-press:#4F2BEA; --brand-pale:#F2EEFF; --brand-border:#DCD2FF;
    --ink:#17171B; --body:#4B4B57; --mute:#6E6E7A; --border:#E5E5EA; --border2:#EDEDF1;
    --surface:#fff; --soft:#F5F5F7; --kakao:#FEE500;
    --r-input:12px; --r-btn:12px; --r-pill:9999px;
    --sans:"Pretendard",-apple-system,BlinkMacSystemFont,"Inter",system-ui,"Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 26px;position:sticky;top:0;background:var(--surface);z-index:2;}
  .back{width:40px;height:40px;border:none;background:transparent;border-radius:10px;color:var(--body);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .back:hover{background:var(--soft);} .back svg{width:22px;height:22px;}
  .login-pill{border:1px solid var(--border);background:#fff;color:var(--brand);font-size:13px;font-weight:700;padding:9px 18px;border-radius:var(--r-pill);cursor:pointer;font-family:inherit;}
  .login-pill:hover{border-color:var(--brand-border);background:var(--brand-pale);}

  .wrap{position:relative;min-height:calc(100vh - 84px);display:flex;align-items:center;justify-content:center;padding:0 24px 60px;overflow:hidden;}
  .glow{position:absolute;left:50%;bottom:-46%;transform:translateX(-50%);width:1100px;height:1100px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(95,62,255,.15), rgba(224,121,164,.10) 38%, rgba(255,255,255,0) 62%);pointer-events:none;}

  .card{position:relative;width:100%;max-width:400px;text-align:center;}
  .logo{font-size:33px;font-weight:800;letter-spacing:-.02em;color:var(--brand);margin-bottom:20px;}
  h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px;}
  .slogan{font-size:14.5px;color:var(--mute);margin:0 0 30px;}

  .field{text-align:left;margin-bottom:12px;}
  .inp{width:100%;background:var(--soft);border:1px solid transparent;border-radius:var(--r-input);padding:15px 16px;font-size:15px;color:var(--ink);font-family:inherit;transition:border-color .15s, box-shadow .15s, background .15s;}
  .inp::placeholder{color:var(--mute);}
  .inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-pale);background:#fff;}

  .btn-primary{width:100%;height:52px;background:var(--brand);color:#fff;border:none;border-radius:var(--r-btn);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s;margin-top:4px;}
  .btn-primary:hover{background:var(--brand-press);}

  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--mute);font-size:12.5px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border2);}

  .social{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .sbtn{display:flex;align-items:center;justify-content:center;gap:9px;height:50px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-btn);font-size:14.5px;font-weight:600;color:var(--ink);font-family:inherit;cursor:pointer;transition:background .15s,border-color .15s,filter .15s;}
  .sbtn:hover{background:var(--soft);}
  .sbtn svg{width:19px;height:19px;flex-shrink:0;}
  .sbtn.kakao{background:var(--kakao);border-color:var(--kakao);color:#191600;} .sbtn.kakao:hover{background:var(--kakao);filter:brightness(.97);}

  .legal{margin-top:22px;font-size:12px;color:var(--mute);line-height:1.6;} .legal a{color:var(--body);font-weight:600;text-decoration:none;}
  .note{margin-top:12px;font-size:12px;color:var(--mute);line-height:1.6;} .note b{color:var(--body);}
</style></head>
<body>
  <div class="topbar">
    <button class="back" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="login-pill">로그인</button>
  </div>
  <div class="wrap">
    <div class="glow"></div>
    <div class="card">
      <div class="logo">Verba</div>
      <h1>계정 만들기</h1>
      <p class="slogan">카피 고민은 짧게, 브랜드다운 문장은 빠르게.</p>

      <div class="field"><input class="inp" type="text" placeholder="이름"></div>
      <div class="field"><input class="inp" type="email" placeholder="이메일 주소"></div>
      <button class="btn-primary">이메일로 계속하기</button>

      <div class="divider">또는</div>
      <div class="social">
        <button class="sbtn"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 5.1 29.3 3 24 3 12.9 3 4 11.9 4 23s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 5.1 29.3 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 43c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 34.5 26.7 35.5 24 35.5c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 43 24 43z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41 36.3 44 30.6 44 23c0-1.3-.1-2.6-.4-3.5z"/></svg>Google</button>
        <button class="sbtn kakao"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#191600" d="M12 3.5C6.9 3.5 2.8 6.8 2.8 10.9c0 2.6 1.7 4.9 4.3 6.2-.2.7-.7 2.5-.8 2.9-.1.5.2.5.4.4.2-.1 2.4-1.6 3.3-2.3.6.1 1.3.1 2 .1 5.1 0 9.2-3.3 9.2-7.4S17.1 3.5 12 3.5Z"/></svg>카카오</button>
      </div>

      <p class="legal">가입하면 <a href="#">이용약관</a> · <a href="#">개인정보처리방침</a>에 동의합니다.</p>
      <p class="note">‘이메일로 계속하기’를 누르면 <b>인증 링크</b>를 보내드려요 · 비밀번호 없음</p>
    </div>
  </div>
</body></html>
